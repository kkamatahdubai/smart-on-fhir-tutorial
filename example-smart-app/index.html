<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>SMART Patient Dashboard</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

<link rel="stylesheet" href="style.css">

<script src="app.js"></script>

</head>

<body>

<div class="header">
SMART on FHIR Patient Dashboard
</div>

<div class="container">

<div id="loading">Loading patient data...</div>

<div id="holder" style="display:none;">

<!-- PATIENT INFO -->
<div class="card patient-card">

<h2>Patient</h2>

<div class="patient-grid">
<div><label>First Name</label><span id="fname"></span></div>
<div><label>Last Name</label><span id="lname"></span></div>
<div><label>Gender</label><span id="gender"></span></div>
<div><label>DOB</label><span id="birthdate"></span></div>
</div>

</div>


<!-- VITALS -->
<div class="card">

<h2>Vitals</h2>

<div class="vitals-grid">

<div class="vital blue">
<div class="vital-title">Height</div>
<div class="vital-value" id="height"></div>
</div>

<div class="vital red">
<div class="vital-title">Systolic BP</div>
<div class="vital-value" id="systolicbp"></div>
</div>

<div class="vital orange">
<div class="vital-title">Diastolic BP</div>
<div class="vital-value" id="diastolicbp"></div>
</div>

<div class="vital green">
<div class="vital-title">LDL</div>
<div class="vital-value" id="ldl"></div>
</div>

<div class="vital green">
<div class="vital-title">HDL</div>
<div class="vital-value" id="hdl"></div>
</div>

<div class="vital purple">
<div class="vital-title">Temperature</div>
<div class="vital-value" id="Temperature"></div>
</div>

</div>

</div>


<!-- ALLERGIES -->
<div class="card">

<h2>Allergies</h2>

<ul id="Allergy" class="allergy-list"></ul>

</div>

</div>
</div>


<script>

$(document).ready(function(){

  extractData().then(
    function(p){
      drawVisualization(p);
    },
    function(){
      $('#loading').html("Error loading patient data");
    }
  );

});

</script>

</body>
</html>
